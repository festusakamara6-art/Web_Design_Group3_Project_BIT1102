</head>
<body>
<header><div class="bar">
<a class="logo" href="index.html">Salone<span>Tech</span> Hub</a>
<button class="icon" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
<nav id="nav" aria-label="Main navigation">

</nav></div></header>

<main>
<section class="view" id="contact">
<h1>Contact us</h1>
<form id="form" novalidate class="card" style="max-width:600px">
<label for="n">Full name</label><input id="n" autocomplete="name"><div class="err" id="en"></div>
<label for="e">Email</label><input id="e" type="email" autocomplete="email"><div class="err" id="ee"></div>
<label for="p">Phone (optional)</label><input id="p" type="tel" placeholder="+232 76 000000"><div class="err" id="ep"></div>
<label for="m">Message</label><textarea id="m" rows="5"></textarea><div class="err" id="em"></div>
<button class="btn" type="submit" style="margin-top:.8rem">Send message</button>
<div id="done"></div></form>
</section>
</main>
<footer>© 2026 SaloneTech Hub · Limkokwing University DCOMP 204 Final Project</footer>
<script src="script.js"></script>
</body>
</html>
